# SPDX-License-Identifier: GPL-2.0
#
# MT7981 两台 CMCC 机型「512M」U-Boot(FIP) + BL2(preloader) 构建（512M 闪存专用）
#
# 覆盖机型（board 名与 configs/ 一致）：
#   cmcc_rax3000m   RAX3000M NAND 标准版
#   cmcc_xr30       XR30 NAND
#
# 两台 U-Boot dts 都是四套 mtd-layout（Web UI 里可选，共用同一份 FIP/BL2）：
#   default  bl2 1024k + u-boot-env 512k + factory 2048k + fip 2048k + ubi 114M（官方默认）
#   112m     同前缀 + ubi 114688k（112MiB）
#   256m     同前缀 + ubi 256512k（250.5MiB，256M 颗粒）
#   490m     同前缀 + ubi 490MiB（512M 颗粒）
#
# 本 workflow 面向 512M 闪存：构建时断言 dts 里存在 490m 布局，产物按 512m 前缀归档。
# 四套布局前缀一致（起点 0x580000），所以同一份 FIP + BL2 通吃四种容量，
# 256M / 512M 两个 workflow 编出来的二进制是同源的，只是归档名和校验目标不同。
#
# 只手动触发（workflow_dispatch），不做 push/schedule 自动跑。
name: MT7981 CMCC 512M Flash U-Boot + BL2

on:
  workflow_dispatch:
    inputs:
      make_release:
        description: '构建完成后发布 Release（两台 FIP + BL2）'
        type: boolean
        default: false
      variant:
        description: '构建变体（改分区请保持 default）'
        type: choice
        default: default
        options:
          - default
          - openwrt
          - ubi
      fip_version:
        description: 'ATF/FIP 版本'
        type: choice
        default: '2025'
        options:
          - '2025'
          - SP1
          - SP2

permissions:
  contents: write

concurrency:
  group: mt7981-512m-uboot
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai
  SOC: mt7981
  MULTI_LAYOUT: '1'
  FIXED_MTDPARTS: '1'
  COPY_BL2: '1'

jobs:
  build:
    name: 🏗️ MT7981 CMCC U-Boot + BL2
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: 检出源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 校验两台机型布局（512M）
        run: |
          set -e
          echo "================= 最新提交 ================="
          git log -1 --format="commit: %H  date: %ci"
          DTS=uboot-mtk-20250711/arch/arm/dts
          CFG=uboot-mtk-20250711/configs
          for pair in \
            "cmcc_rax3000m:mt7981-cmcc-rax3000m" \
            "cmcc_xr30:mt7981-cmcc-xr30"; do
            b=${pair%%:*}; t=${pair##*:}
            test -f "$CFG/${SOC}_${b}_multi_layout_defconfig" \
              || { echo "::error::缺少 ${SOC}_${b}_multi_layout_defconfig"; exit 1; }
            grep -q '^CONFIG_MEDIATEK_MULTI_MTD_LAYOUT=y$' "$CFG/${SOC}_${b}_multi_layout_defconfig" \
              || { echo "::error::${b} 的多分区配置没开 CONFIG_MEDIATEK_MULTI_MTD_LAYOUT"; exit 1; }
            test -f "$DTS/$t.dts" || { echo "::error::缺少 dts $t.dts"; exit 1; }
            grep -q 'mtd-layout' "$DTS/$t.dts" \
              || { echo "::error::$t.dts 里没有 mtd-layout（多分区靠它）"; exit 1; }
            echo "✔ $b（$t.dts 有 mtd-layout，多分区配置就位）"
          done
          # 本 workflow 针对 512M 闪存：确认目标布局存在（四套布局应齐全）
          for t in mt7981-cmcc-rax3000m mt7981-cmcc-xr30; do
            grep -q "label = \"490m\";" "$DTS/$t.dts" \
              || { echo "::error::$t.dts 缺少 490m 布局"; exit 1; }
            for lab in default 112m 256m 490m; do
              grep -q "label = \"$lab\";" "$DTS/$t.dts" \
                || echo "::warning::$t.dts 缺少 $lab 布局（四布局不完整）"
            done
            echo "OK   $t 含 490m 布局（512M 闪存用）"
          done
          echo "================= 各机型 layout 一览 ================="
          for t in mt7981-cmcc-rax3000m mt7981-cmcc-xr30; do
            echo "--- $t"
            awk '/mtd-layout \{/,/^\t\};/' "$DTS/$t.dts" | grep -E 'label =|mtdparts =' || true
          done

      - name: 安装编译依赖
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install $(cat depends/ubuntu-22.04)
          sudo -E apt-get -qq install rename tar
          # python2.7 在 22.04 只作为部分脚本的兼容依赖，缺失不致命
          sudo -E apt-get -qq autoremove --purge >/dev/null 2>&1 || true
          sudo -E apt-get -qq clean
          arm-linux-gnueabi-gcc --version | head -1
          aarch64-linux-gnu-gcc --version | head -1
          dtc --version

      - name: 构建两台机型（FIP + BL2）
        run: |
          # 逻辑都在脚本里，避免 YAML 里堆大段内联 shell
          bash .github/scripts/build-multi-layout.sh "cmcc_rax3000m cmcc_xr30"

      - name: 按容量命名产物（512m）
        run: |
          set -e
          mkdir -p pkg
          for f in out/*; do
            [ -f "$f" ] || continue
            b=$(basename "$f")
            case "$b" in
              sha256sums.txt) continue ;;
            esac
            cp -f "$f" "pkg/512m-$b"
          done
          ls -lh pkg
          ( cd pkg && sha256sum ./* > sha256sums.txt )

      - name: 上传编译日志（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-mt7981-512m
          path: build-*.log
          retention-days: 7
          if-no-files-found: warn

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: mt7981-multi-layout-uboot-bl2
          path: pkg/
          retention-days: 30
          if-no-files-found: error

      - name: 发布 Release
        if: ${{ inputs.make_release == true }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -e
          TAG="mt7981-512m-uboot-$(TZ=Asia/Shanghai date +%Y%m%d)"
          if gh release view "$TAG" >/dev/null 2>&1; then
            TAG="${TAG}-r${GITHUB_RUN_NUMBER}"
            echo "::warning::同名 release 已存在，本次用 $TAG"
          fi
          {
            echo "### MT7981 CMCC 512M 闪存 U-Boot(FIP) + BL2"
            echo "- 机型：cmcc_rax3000m（RAX3000M NAND）/ cmcc_xr30（XR30）"
            echo "- 目标布局：490m（FIP 内含 default/112m/256m/490m 四套，Web UI 里选）"
            echo "- 多分区：$( [ "$MULTI_LAYOUT" = "1" ] && echo '开（Web UI 可选 default / immortalwrt-490m 等布局）' || echo '关' )"
            echo "- 固定 MTDPARTS：$( [ "$FIXED_MTDPARTS" = "1" ] && echo '开' || echo '关' )"
            echo "- 变体：${{ inputs.variant }}，ATF 版本：${{ inputs.fip_version }}"
            echo "- 提交：${{ github.sha }}"
            echo ""
            echo "| 文件 | 大小 |"
            echo "|---|---|"
            ls -lh pkg | tail -n +2 | awk '{printf "| %s | %s |\n", $9, $5}'
            echo ""
            echo "> ⚠️ 原厂 128M 颗粒只能选 default / 112m；256m 布局仅适用于硬改 256M 闪存的机器。"
            echo "> FIP 用 U-Boot Web 或 tftp 写入 fip 分区；BL2 只在需要救砖/重写引导时刷。"
          } > notes.md
          gh release create "$TAG" pkg/* --title "MT7981 CMCC 512M Flash U-Boot + BL2 ($(TZ=Asia/Shanghai date +%Y-%m-%d))" --notes-file notes.md
          echo ">>> 已发布 $TAG"
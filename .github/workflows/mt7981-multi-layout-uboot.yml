# SPDX-License-Identifier: GPL-2.0
#
# MT7981 两台 CMCC 机型「三分区」U-Boot(FIP) + BL2(preloader) 构建
#
# 覆盖机型（board 名与 configs/ 一致）：
#   cmcc_rax3000m   RAX3000M NAND 标准版（128M 原厂）
#   cmcc_xr30       XR30 NAND
#
# 两台各三套 mtd-layout（U-Boot Web UI 里可选）：
#   default  官方默认分区      : bl2 1024k + u-boot-env 512k + factory 2048k + fip 2048k + ubi 114M
#   112m     112M 大分区       : 同上前缀 + ubi 114688k（112MiB）
#   256m     硬改 256M spi-nand : 同上前缀 + ubi 256512k（250.5MiB，即 0xFA80000）
#
# 256M 布局的 ubi 起点 0x580000 与大小 0xFA80000 与 tvliving/lede 的 256M 机型一致
# （lede dts: reg = <0x580000 0x7200000> 是原厂 114M；硬改 256M 版本扩到 0xFA80000）。
#
# 只手动触发（workflow_dispatch），不做 push/schedule 自动跑。
name: MT7981 CMCC Multi-Layout U-Boot + BL2

on:
  workflow_dispatch:
    inputs:
      make_release:
        description: '构建完成后发布 Release（两台 FIP + BL2）'
        type: boolean
        default: false
      variant:
        description: '构建变体（改分区请保持 default）'
        type: choice
        default: default
        options:
          - default
          - openwrt
          - ubi
      fip_version:
        description: 'ATF/FIP 版本'
        type: choice
        default: '2025'
        options:
          - '2025'
          - SP1
          - SP2

permissions:
  contents: write

concurrency:
  group: mt7981-multi-layout-uboot
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai
  SOC: mt7981
  MULTI_LAYOUT: '1'
  FIXED_MTDPARTS: '1'
  COPY_BL2: '1'

jobs:
  build:
    name: 🏗️ MT7981 CMCC U-Boot + BL2
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: 检出源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 校验两台机型三分区配置
        run: |
          set -e
          echo "================= 最新提交 ================="
          git log -1 --format="commit: %H  date: %ci"
          DTS=uboot-mtk-20250711/arch/arm/dts
          CFG=uboot-mtk-20250711/configs
          for pair in \
            "cmcc_rax3000m:mt7981-cmcc-rax3000m" \
            "cmcc_xr30:mt7981-cmcc-xr30"; do
            b=${pair%%:*}; t=${pair##*:}
            test -f "$CFG/${SOC}_${b}_multi_layout_defconfig" \
              || { echo "::error::缺少 ${SOC}_${b}_multi_layout_defconfig"; exit 1; }
            grep -q '^CONFIG_MEDIATEK_MULTI_MTD_LAYOUT=y$' "$CFG/${SOC}_${b}_multi_layout_defconfig" \
              || { echo "::error::${b} 的多分区配置没开 CONFIG_MEDIATEK_MULTI_MTD_LAYOUT"; exit 1; }
            test -f "$DTS/$t.dts" || { echo "::error::缺少 dts $t.dts"; exit 1; }
            grep -q 'mtd-layout' "$DTS/$t.dts" \
              || { echo "::error::$t.dts 里没有 mtd-layout（多分区靠它）"; exit 1; }
            echo "✔ $b（$t.dts 有 mtd-layout，多分区配置就位）"
          done
          echo "================= 各机型 layout 一览 ================="
          for t in mt7981-cmcc-rax3000m mt7981-cmcc-xr30; do
            echo "--- $t"
            awk '/mtd-layout \{/,/^\t\};/' "$DTS/$t.dts" | grep -E 'label =|mtdparts =' || true
          done

      - name: 安装编译依赖
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install $(cat depends/ubuntu-22.04)
          sudo -E apt-get -qq install rename tar
          # python2.7 在 22.04 只作为部分脚本的兼容依赖，缺失不致命
          sudo -E apt-get -qq autoremove --purge >/dev/null 2>&1 || true
          sudo -E apt-get -qq clean
          arm-linux-gnueabi-gcc --version | head -1
          aarch64-linux-gnu-gcc --version | head -1
          dtc --version

      - name: 构建两台机型（三分区 FIP + BL2）
        run: |
          set -euo pipefail
          VARIANT="${{ inputs.variant || 'default' }}"
          VERSION="${{ inputs.fip_version || '2025' }}"
          mkdir -p out
          FAIL=0
          for b in cmcc_rax3000m cmcc_xr30; do
            echo ""
            echo "================= BUILD $b ================="
            if BOARD="$b" SOC="$SOC" VERSION="$VERSION" VARIANT="$VARIANT" \
               MULTI_LAYOUT="$MULTI_LAYOUT" FIXED_MTDPARTS="$FIXED_MTDPARTS" COPY_BL2="$COPY_BL2" \
               ./build.sh 2>&1 | tee "build-$b.log"; then
              echo "✔ $b 构建完成"
            else
              echo "::error::$b 构建失败（日志见 build-$b.log）"
              tail -60 "build-$b.log" || true
              FAIL=1
            fi
            # 收集该机型的产物（名称里带 board / 含 multi-layout 标识）
            for f in output/*"$b"*; do
              [ -f "$f" ] || continue
              cp -f "$f" out/
            done
            # 校验：FIP 与 BL2 都要拿到
            ls out/*"$b"*fip* >/dev/null 2>&1 \
              || { echo "::error::$b 没有产出 fip.bin"; FAIL=1; }
            ls out/*"$b"*bl2*  >/dev/null 2>&1 \
              || { echo "::error::$b 没有产出 bl2.img"; FAIL=1; }
            ls out/*"$b"*multi-layout* >/dev/null 2>&1 \
              || { echo "::warning::$b 的产物名里没有 multi-layout 标识，确认 MULTI_LAYOUT 是否生效"; }
          done

          echo "================= out/ ================="
          ls -lh out || true
          if [ -n "$(ls out 2>/dev/null)" ]; then
            (cd out && sha256sum ./* > sha256sums.txt)
          fi
          if [ "$FAIL" != 0 ]; then
            echo "::error::有机型构建或校验失败，下面打印目录便于定位"
            echo "===== output/ ====="
            ls -lh output 2>/dev/null || echo "(没有 output 目录，说明 build.sh 没跑到底)"
            echo "===== out/ ====="
            ls -lh out 2>/dev/null || true
            exit 1
          fi

      - name: 上传编译日志（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-mt7981-multi-layout
          path: build-*.log
          retention-days: 7
          if-no-files-found: warn

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: mt7981-multi-layout-uboot-bl2
          path: out/
          retention-days: 30
          if-no-files-found: error

      - name: 发布 Release
        if: ${{ inputs.make_release == true }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -e
          TAG="mt7981-multi-layout-uboot-$(TZ=Asia/Shanghai date +%Y%m%d)"
          if gh release view "$TAG" >/dev/null 2>&1; then
            TAG="${TAG}-r${GITHUB_RUN_NUMBER}"
            echo "::warning::同名 release 已存在，本次用 $TAG"
          fi
          {
            echo "### MT7981 CMCC 三分区 U-Boot(FIP) + BL2"
            echo "- 机型：cmcc_rax3000m（RAX3000M NAND）/ cmcc_xr30（XR30）"
            echo "- 布局：default（114M）/ 112m / 256m（硬改 256M）"
            echo "- 多分区：$( [ "$MULTI_LAYOUT" = "1" ] && echo '开（Web UI 可选 default / immortalwrt-490m 等布局）' || echo '关' )"
            echo "- 固定 MTDPARTS：$( [ "$FIXED_MTDPARTS" = "1" ] && echo '开' || echo '关' )"
            echo "- 变体：${{ inputs.variant }}，ATF 版本：${{ inputs.fip_version }}"
            echo "- 提交：${{ github.sha }}"
            echo ""
            echo "| 文件 | 大小 |"
            echo "|---|---|"
            ls -lh out | tail -n +2 | awk '{printf "| %s | %s |\n", $9, $5}'
            echo ""
            echo "> ⚠️ 原厂 128M 颗粒只能选 default / 112m；256m 布局仅适用于硬改 256M 闪存的机器。"
            echo "> FIP 用 U-Boot Web 或 tftp 写入 fip 分区；BL2 只在需要救砖/重写引导时刷。"
          } > notes.md
          gh release create "$TAG" out/* --title "MT7981 CMCC Multi-Layout U-Boot + BL2 ($(TZ=Asia/Shanghai date +%Y-%m-%d))" --notes-file notes.md
          echo ">>> 已发布 $TAG"
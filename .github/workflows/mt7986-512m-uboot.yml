# SPDX-License-Identifier: GPL-2.0
#
# MT7986 三机型「512MB NAND 多分区」U-Boot(FIP) + BL2(preloader) 构建
#
# 覆盖机型（board 名与 configs/ 里的名字一致）：
#   redmi_ax6000-512m    红米 AX6000 512M（layout: default 128M / immortalwrt-110m / immortalwrt-490m）
#   netcore_n60-pro      磊科 N60 Pro（layout: default 128M / immortalwrt-490m）      ← 本次新增多分区
#   ruijie_rg-x60-pro    锐捷 RG-X60 Pro（layout: default 63M / ubi-107m / immortalwrt-490m）← 本次新增 512M 布局
#
# 三个 layout 的 ubi 与 immortalwrt-mt798x-6.6 里对应 512rom 机型的 dts 严格对齐：
#   AX6000   : 1024+256+256+2048+2048+256+256 = 6144k，ubi 501760k（490MiB，总 496MiB）
#   N60 Pro  : 1024+512+2048+2048            = 5632k，ubi 502272k（490.5MiB，总 496MiB）
#   X60 Pro  : 1024+512+2048+2048+512+512     = 6656k，ubi 501248k（489.5MiB，总 496MiB）
# 三台都只用到 496MiB（与 immortalwrt 侧的 0x1F000000 边界一致），尾段留作 NMBM/坏块余量。
#
# 只手动触发（workflow_dispatch）：点 Run workflow → 选是否发 Release 即可，
# 不做 push/schedule 自动跑，避免占用额度。
name: MT7986 512M Multi-Layout U-Boot + BL2

on:
  workflow_dispatch:
    inputs:
      make_release:
        description: '构建完成后发布 Release（三机型 FIP + BL2）'
        type: boolean
        default: false
      variant:
        description: '构建变体（改分区请保持 default）'
        type: choice
        default: default
        options:
          - default
          - openwrt
          - ubi
      fip_version:
        description: 'ATF/FIP 版本'
        type: choice
        default: '2025'
        options:
          - '2025'
          - SP1
          - SP2

permissions:
  contents: write

concurrency:
  group: mt7986-512m-uboot
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai
  SOC: mt7986
  MULTI_LAYOUT: '1'
  FIXED_MTDPARTS: '1'
  COPY_BL2: '1'

jobs:
  build:
    name: 🏗️ MT7986 512M U-Boot + BL2
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: 检出源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 校验三机型多分区配置
        run: |
          set -e
          echo "================= 最新提交 ================="
          git log -1 --format="commit: %H  date: %ci"
          DTS=uboot-mtk-20250711/arch/arm/dts
          CFG=uboot-mtk-20250711/configs
          for pair in \
            "redmi_ax6000-512m:mt7986a-redmi-ax6000-512m" \
            "netcore_n60-pro:mt7986a-netcore-n60-pro" \
            "ruijie_rg-x60-pro:mt7986a-ruijie-x60-pro"; do
            b=${pair%%:*}; t=${pair##*:}
            test -f "$CFG/${SOC}_${b}_multi_layout_defconfig" \
              || { echo "::error::缺少 ${SOC}_${b}_multi_layout_defconfig"; exit 1; }
            grep -q '^CONFIG_MEDIATEK_MULTI_MTD_LAYOUT=y$' "$CFG/${SOC}_${b}_multi_layout_defconfig" \
              || { echo "::error::${b} 的多分区配置没开 CONFIG_MEDIATEK_MULTI_MTD_LAYOUT"; exit 1; }
            test -f "$DTS/$t.dts" || { echo "::error::缺少 dts $t.dts"; exit 1; }
            grep -q 'mtd-layout' "$DTS/$t.dts" \
              || { echo "::error::$t.dts 里没有 mtd-layout（多分区靠它）"; exit 1; }
            echo "✔ $b（$t.dts 有 mtd-layout，多分区配置就位）"
          done
          echo "================= 各机型 layout 一览 ================="
          for t in mt7986a-redmi-ax6000-512m mt7986a-netcore-n60-pro mt7986a-ruijie-x60-pro; do
            echo "--- $t"
            awk '/mtd-layout \{/,/^\t\};/' "$DTS/$t.dts" | grep -E 'label =|mtdparts =' || true
          done

      - name: 安装编译依赖
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install $(cat depends/ubuntu-22.04)
          sudo -E apt-get -qq install rename tar
          # python2.7 在 22.04 只作为部分脚本的兼容依赖，缺失不致命
          sudo -E apt-get -qq autoremove --purge >/dev/null 2>&1 || true
          sudo -E apt-get -qq clean
          arm-linux-gnueabi-gcc --version | head -1
          aarch64-linux-gnu-gcc --version | head -1
          dtc --version

      - name: 构建三机型（多分区 FIP + BL2）
        run: |
          set -euo pipefail
          VARIANT="${{ inputs.variant || 'default' }}"
          VERSION="${{ inputs.fip_version || '2025' }}"
          mkdir -p out
          FAIL=0
          for b in redmi_ax6000-512m netcore_n60-pro ruijie_rg-x60-pro; do
            echo ""
            echo "================= BUILD $b ================="
            if BOARD="$b" SOC="$SOC" VERSION="$VERSION" VARIANT="$VARIANT" \
               MULTI_LAYOUT="$MULTI_LAYOUT" FIXED_MTDPARTS="$FIXED_MTDPARTS" COPY_BL2="$COPY_BL2" \
               ./build.sh 2>&1 | tee "build-$b.log"; then
              echo "✔ $b 构建完成"
            else
              echo "::error::$b 构建失败（日志见 build-$b.log）"
              tail -60 "build-$b.log" || true
              FAIL=1
            fi
            # 收集该机型的产物（名称里带 board / 含 multi-layout 标识）
            for f in output/*"$b"*; do
              [ -f "$f" ] || continue
              cp -f "$f" out/
            done
            # 校验：FIP 与 BL2 都要拿到
            ls out/*"$b"* 2>/dev/null | grep -q fip || { echo "::error::$b 没有产出 fip.bin"; FAIL=1; }
            ls out/*"$b"* 2>/dev/null | grep -q bl2 || { echo "::error::$b 没有产出 bl2.img"; FAIL=1; }
            ls out/*"$b"*multi-layout* >/dev/null 2>&1 \
              || { echo "::warning::$b 的产物名里没有 multi-layout 标识，确认 MULTI_LAYOUT 是否生效"; }
          done

          echo "================= out/ ================="
          ls -lh out || true
          if [ -n "$(ls out 2>/dev/null)" ]; then
            (cd out && sha256sum ./* > sha256sums.txt)
          fi
          [ "$FAIL" = 0 ] || { echo "::error::至少一个机型构建/校验失败"; exit 1; }

      - name: 上传编译日志（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-mt7986-512m
          path: build-*.log
          retention-days: 7
          if-no-files-found: warn

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: mt7986-512m-uboot-bl2
          path: out/
          retention-days: 30
          if-no-files-found: error

      - name: 发布 Release
        if: ${{ inputs.make_release == true }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -e
          TAG="mt7986-512m-uboot-$(TZ=Asia/Shanghai date +%Y%m%d)"
          if gh release view "$TAG" >/dev/null 2>&1; then
            TAG="${TAG}-r${GITHUB_RUN_NUMBER}"
            echo "::warning::同名 release 已存在，本次用 $TAG"
          fi
          {
            echo "### MT7986 512M 多分区 U-Boot(FIP) + BL2"
            echo "- 机型：redmi_ax6000-512m / netcore_n60-pro / ruijie_rg-x60-pro"
            echo "- 多分区：$( [ "$MULTI_LAYOUT" = "1" ] && echo '开（Web UI 可选 default / immortalwrt-490m 等布局）' || echo '关' )"
            echo "- 固定 MTDPARTS：$( [ "$FIXED_MTDPARTS" = "1" ] && echo '开' || echo '关' )"
            echo "- 变体：${{ inputs.variant }}，ATF 版本：${{ inputs.fip_version }}"
            echo "- 提交：${{ github.sha }}"
            echo ""
            echo "| 文件 | 大小 |"
            echo "|---|---|"
            ls -lh out | tail -n +2 | awk '{printf "| %s | %s |\n", $9, $5}'
            echo ""
            echo "> ⚠️ 刷机前确认机器已换成 512MB NAND 颗粒；原厂 128M 颗粒只能选 default 布局。"
            echo "> FIP 用 U-Boot Web 或 tftp 写入 fip 分区；BL2 只在需要救砖/重写引导时刷。"
          } > notes.md
          gh release create "$TAG" out/* --title "MT7986 512M U-Boot + BL2 ($(TZ=Asia/Shanghai date +%Y-%m-%d))" --notes-file notes.md
          echo ">>> 已发布 $TAG"